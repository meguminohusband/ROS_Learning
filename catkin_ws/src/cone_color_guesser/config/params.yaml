# ============================================================
# cone_color_guesser 参数配置
#
# 所有"魔法数字"都放在这里，不要硬编码在代码里。
# 原因：你一定会反复调参数，硬编码的话每次都要重新编译。
#
# 改完这个文件后，不需要 catkin_make，
# 直接重新 rosrun/roslaunch 就生效。
# ============================================================

# ---------- 输入输出 ----------
input_topic:  "/only_lidar_points_pub"
target_frame: "imu_link"      # 目标坐标系（本 bag 里是 imu_link，没有 base_link）
output_topic: "/cones/colored"

# ---------- 杂点剔除 ----------
noise_nn_threshold: 0.5       # ★ 最近邻距离 < 此值 → 判定为杂点 (米)
                              #   实测：正常锥桶间距 2.5 m，杂点间距 0.16 m
noise_z_max:        0.90      # z 超过此值 → 丢弃 (米)。实测锥桶 z 最高 0.72

# ---------- 有效范围 ----------
min_range:      2.0           # 太近的点不要（可能是车上的反射）(米)
max_range:      40.0          # 太远的点不要。实测点云最远 40 m
max_lateral:    15.0          # 横向超过此值 → 不在赛道上 (米)

# ---------- 左右分色：以「车辆路径切向」为基准 ----------
# 原理：车就是沿赛道走的，所以「车辆在地图系下走过的路径」在任一点处的
#       切向 = 该处的行进方向（直接测量）。把锥桶投影到路径上，
#       左侧 = z × d，侧向偏移 s 的符号即颜色（s>0 红，s<0 蓝）。
# 为什么不用「帧内配对 + 相邻中点方向」：
#       实测锥桶沿赛道间隔中位数约 2.31 m，赛道宽约 3.07 m，尺度重叠；
#       按距离贪心配对有 74% 的概率把「同一侧的相邻锥桶」配成一对，
#       配对中点不在赛道中线上，推出的方向是错的 → 红蓝随机翻转。
path_step:      0.5           # 路径抽稀步长 (米)：车辆每移动这么远记一个路径点
path_gate:      3.2           # ★ 锥桶到路径的横向门限 (米)，超过即视为非赛道目标
                              #   实测：赛道边界排在 0.00~2.88 m；赛道外还有一排真实物体在
                              #   3.59~8.98 m（不应上色，原来 5.0 会把它们一起染红）；
                              #   11 m 以外是杂点团块。取 3.2 正好落在两道之间的空档里。
s_min:          0.40          # ★ 侧向偏移小于此值（贴中线）不判色，宁可漏发
path_margin:    3.0           # 投影需落在「已驶过路径」内部至少这么多米才算可信
                              #   —— 满足时切向是实测的，投票取满权 1.0
path_tan_half:  1.5           # 切向用 ±该值 的中心差分 (米)，抑制单段噪声
head_range:     8.0           # ★ 车前方此距离内，可用当前车头朝向定「暂定色」(米)
                              #   实测车头朝向判左右的准确率：0-5 m 97%、5-8 m 81%、
                              #   8-12 m 只有 53%（近乎随机）。所以可靠范围就是 8 m，
                              #   再远宁可不显示，也不显示可能错的颜色。
head_weight:    0.30          # 车头朝向近似观测的投票权重（降权，避免锁死错色）

# ---------- 显示分级（UNKNOWN → PROVISIONAL → LOCKED） ----------
# 车一边前进，一边给前方锥桶上「暂定色」，驶过之后升级成「锁定色」。
#   锁定色（实心全亮）：车已驶过，满权票够 → 永久不变
#   暂定色（降亮半透明）：车前方 ≤ head_range，票数够但还没锁定 → 先显示出来
# 这样不会出现「要等车开过去锥桶才出现颜色」的问题。
provisional_min_votes: 2.0    # ★ 显示暂定色所需的最少加权票

# ---------- 时序滤波 ----------
enable_temporal:    true      # 是否启用跨帧投票
vote_threshold:     0.8       # 领先票占比超过此值才锁定颜色
min_votes:          6.0       # 加权总票门槛
min_reliable_votes: 2         # ★ 至少几次「实测切向」的满权票才允许锁定
                              #   —— 防止最早几帧（车辆几乎没动）把颜色锁死
map_assoc_dist:     1.2       # ★ 跨帧关联距离门限 (米)。锥桶间最近也隔约 2 m，取 1.2
                              #   既不会误并相邻锥桶，又能吸收观测抖动 ——
                              #   原来取 0.9 会把同一个锥桶拆成好几条轨迹（输出有重复点）
map_max_miss:       60        # 未锁定的候选轨迹连续多少帧没看到就删；已锁定的永不删
                              #   给足 6 s，让「只在车前方短暂看到过」的锥桶能等到
                              #   车辆驶过它的位置后被重新评分、补上颜色

# ---------- 调试 ----------
publish_debug:     true       # 是否发布调试话题
print_timing:      true       # 是否打印每帧耗时